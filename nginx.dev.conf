# ALUR REQUEST (dari browser sampai database)
#
# Saat browser mengakses localhost:8000, request sampai ke Nginx,
# yang diatur oleh nginx.dev.conf (file ini). Nginx melihat request-nya,
# lalu menyerahkan urusan PHP ke service "app". Di dalam "app", PHP berjalan
# dengan perilaku yang diatur oleh php.ini. Saat aplikasi perlu menyimpan atau
# mengambil data, ia menghubungi database memakai username dan password
# yang tercatat di .env.docker.

server {
    listen 80;                       # nginx mendengarkan di port 80 (di dalam container)
    index index.php;                 # file default yang dicari saat akses folder
    root /var/www/html/public;       # document root; hanya folder public yang terekspos (menunjuk ke folder public laravel sebagai pintu masuk utama)

    location / {
        # Coba file asli ($uri), lalu folder ($uri/),
        # kalau tidak ada, teruskan semua request ke index.php (front controller)
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {              # semua request berakhiran .php masuk ke sini
        fastcgi_pass app:9000;       # kirim ke PHP-FPM di service "app" port 9000
        fastcgi_index index.php;
        include fastcgi_params;      # load parameter FastCGI standar
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # path lengkap file PHP yang dieksekusi
    }
}

